[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-coordination"
version = "0.1.0"
description = "Event coordination domain services"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["event_coordination*"]

[tool.setuptools.package-data]
event_coordination = ["migrations/*.sql", "identity/*.sql"]
